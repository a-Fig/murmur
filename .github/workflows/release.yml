# Pushing a tag like v0.1.0 publishes a release: mur built for macOS, Linux and Windows (amd64 and
# arm64), with a SHA256SUMS file that install.sh and install.ps1 check their download against (#58),
# and release.json and its signature, which the updater checks once mur has a release key (#193).
#
# It runs on GitHub's own Linux runner, which cross-compiles every target (CGO_ENABLED=0). A tag
# push starts it, only people with write access can push a tag here, and a tag pushed to a fork
# runs in the fork. nightly.yml also calls it with a tag it created: a tag created with GITHUB_TOKEN
# starts no workflow (#244). docs/releasing.md says how to cut a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, already pushed
        required: true
        type: string
    secrets:
      RELEASE_SIGNING_KEY:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A called workflow's github.ref is its caller's (main), so the tag comes from the input.
      TAG: ${{ inputs.tag || github.ref_name }}
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      # Actions are pinned to a commit, since this job can write releases (#308's review).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # go.mod's toolchain line is the Go a release is built with. No cache: one restored from
      # another workflow's run would go into the binaries unchecked.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag $TAG is not a version like v1.2.3 or v1.2.3-pre.1, so nothing was released."
            exit 1
          fi
          go version
      - name: Build every platform
        run: |
          version=${TAG#v}
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=''
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-X main.version=$version" -o "dist/mur-$os-$arch$ext" ./cmd/mur
          done
          # The runner's own binary must report the tag's version, or `-X` missed its variable.
          out=$(dist/mur-$(go env GOHOSTOS)-$(go env GOHOSTARCH) version)
          case "$out" in
            *" $version") ;;
            *) echo "::error::The built binary says \"$out\", not the version $version."; exit 1 ;;
          esac
          (cd dist && sha256sum mur-* > SHA256SUMS && cat SHA256SUMS)
      # A known vulnerability the binaries can reach stops the release; raising go.mod's toolchain
      # line to the Go release that fixes it is the usual cure.
      - name: Check the binaries for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for bin in dist/mur-*; do
            echo "govulncheck $bin"
            "$(go env GOPATH)/bin/govulncheck" -mode=binary "$bin"
          done
      # Writes dist/release.json (the tag, its channel and every file's SHA-256) and signs it. With
      # no secret it signs nothing while internal/update/keys.go is empty, and fails the release
      # once it isn't. docs/releasing.md has the key.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./internal/update/signrelease -tag "$TAG" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=''
          case "$TAG" in *-*) flags=--prerelease ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes $flags
