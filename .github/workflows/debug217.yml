# DEBUG for #217, not to be merged: does starting `git` hang on macOS, with and without -race?
name: debug217

on:
  pull_request:

permissions:
  contents: read

jobs:
  fork:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: race-1, flags: '-race', cgo: '1'}
          - {name: race-2, flags: '-race', cgo: '1'}
          - {name: plain-cgo0-1, flags: '', cgo: '0'}
          - {name: plain-cgo0-2, flags: '', cgo: '0'}
          - {name: plain-cgo1, flags: '', cgo: '1'}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FORKSTRESS: 30m
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go version && sw_vers && which -a git && git --version
      - run: go test ${{ matrix.flags }} -count=1 -v -timeout 40m -run TestForkStress ./internal/gitx 2>&1 | tee out.txt | grep -v '^\s' | grep -E 'FORKSTRESS|---|ok|FAIL|git is'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-${{ matrix.name }}
          path: out.txt
