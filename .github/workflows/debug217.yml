# DEBUG for #217, not to be merged: the whole daemon package, run over and over on macOS, with a
# goroutine dump and the daemons' logs on a failure, and each test's time.
name: debug217

on:
  pull_request:

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DEBUG217: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -c -o daemon.test ./internal/daemon
      - name: loop
        run: |
          cd internal/daemon
          end=$(( $(date +%s) + 50*60 ))
          i=0; failed=0
          while [ $(( $(date +%s) + 700 )) -lt $end ]; do
            i=$((i+1)); s=$(date +%s)
            if ../../daemon.test -test.count=1 -test.v -test.timeout 15m > ../../out-$i.txt 2>&1; then r=ok; else r=FAIL; failed=1; fi
            echo "run $i: $r in $(( $(date +%s) - s ))s"
            grep -E -- '^--- FAIL' ../../out-$i.txt || true
            grep -E -- '--- (PASS|FAIL)' ../../out-$i.txt | sed -E 's/.*--- (PASS|FAIL): ([^ ]+) \((.*)s\)/\3 \2/' | sort -rn | head -4
            grep 'DEBUG217 goroutines' ../../out-$i.txt | tail -1
          done
          exit $failed
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.shard }}
          path: out-*.txt
