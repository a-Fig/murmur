# Every pull request runs the checks each change must pass, so a change's verification doesn't wait
# on a laptop shared with other agents' test runs, or die when that laptop sleeps (#48).
#
# The jobs run in parallel on GitHub's own runners, which are free for a public repo and start fresh
# for every job. `changes` picks which of them a pull request needs from the files it touches
# (scripts/ci-level.sh); a push to `main` and a run by hand run them all. A pull request runs
# internal/daemon's tests on Linux alone unless it is `full` (Go that differs per OS, go.mod and
# go.sum, the workflows, scripts/): on macOS and Windows they are most of CI's time, and main's run
# still finds what they catch before the nightly takes it (#879). docs/testing.md has the reasons
# and the times.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its run in progress. A push to `main` is its own group, so
# each one's run finishes: the nightly takes the newest commit whose run passed. The event is in the
# name so a run by hand on that commit doesn't cancel the push's.
concurrency:
  group: test-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      level: ${{ steps.level.outputs.level }}
    steps:
      # A pull request's checkout is the merge of it into main, so its first parent is main as it
      # was: scripts/ci-level.sh reads what the change did to Go from that.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: level
        env:
          CI_LEVEL_BASE: HEAD^1
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # The rules are checked before their answer is used: a pull request that breaks them
          # would otherwise choose to skip the job that says so. The retry's own checks run here
          # too, as the one job every run has.
          sh scripts/ci-level-test.sh
          bash scripts/go-test-retry-test.sh
          level=full
          if [ "$EVENT" = pull_request ]; then
            # One line per file: its name, a tab, and the name it was renamed from, which counts
            # too. A list GitHub cut short, or couldn't give, leaves `full`.
            if files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | "\(.filename)\t\(.previous_filename // "")"'); then
              if [ "$(printf '%s\n' "$files" | grep -c .)" = "$CHANGED" ]; then
                level=$(printf '%s\n' "$files" | tr '\t' '\n' | sh scripts/ci-level.sh)
              fi
            fi
          fi
          case "$level" in
            none | site | page | go | full) ;;
            *) echo "::error::scripts/ci-level.sh answered '$level'"; exit 1 ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Jobs for this run: \`$level\` (scripts/ci-level.sh)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$level" != full ]; then
            echo "The daemon's tests on macOS and Windows run when this merges. To run them now: \`gh workflow run test.yml --ref <branch>\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "level: $level"

  test-linux:
    needs: changes
    if: needs.changes.outputs.level != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GO: ${{ needs.changes.outputs.level != 'site' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        if: env.GO == 'true'
        with:
          go-version-file: go.mod
      - name: gofmt
        if: env.GO == 'true'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - if: env.GO == 'true'
        run: go vet ./...
      # The desktop app is in a Linux build only with -tags desktop (docs/design/desktop.md).
      - if: env.GO == 'true'
        run: go vet -tags desktop ./internal/desktop ./cmd/mur
      # The site's Worker and the files machines read on it (site/test), with the runner's own node,
      # before the Go tests, which take most of the job. A change to site/ alone stops here.
      - run: node --test --import ./site/test/register.mjs site/test/*.test.mjs
      # -v prints each test's time, which scripts/daemon-test-times.sh reads back from the log to
      # say where the daemon package's time goes (#1008); it costs log lines, not time.
      - if: env.GO == 'true'
        env:
          MURMUR_GIT_STATS: ${{ runner.temp }}/git-stats.txt
        run: bash scripts/go-test-retry.sh -v -race -count=1 -timeout 25m ./...
      - name: How git did (#513)
        if: always() && env.GO == 'true'
        run: |
          f="$RUNNER_TEMP/git-stats.txt"
          if [ -f "$f" ]; then cat "$f"; { echo '```'; cat "$f"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"; fi

  # macOS and Windows run `internal/daemon` apart from the other packages, in shards (below): alone
  # it took 1,154 s of this job's 20 minutes on 2026-11-12, and the others together about 4.
  test-macos:
    needs: changes
    if: needs.changes.outputs.level == 'go' || needs.changes.outputs.level == 'full'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go list ./... | grep -v '/internal/daemon$' | xargs bash scripts/go-test-retry.sh -race -count=1 -timeout 25m
      # Releases are built without cgo, which on macOS puts purego's runtime shim (fakecgo) under
      # every command, since the desktop app's web view comes through purego. -race turns cgo on and
      # hides it, so the commands' own packages run again as releases are built, and a release-built
      # mur starts and runs the hook (docs/design/desktop.md).
      - name: go test, built as releases are
        env:
          CGO_ENABLED: '0'
        run: |
          bash scripts/go-test-retry.sh -count=1 -timeout 20m ./cmd/mur ./internal/client ./internal/hook ./internal/desktop
          go build -trimpath -o "$RUNNER_TEMP/mur" ./cmd/mur
          "$RUNNER_TEMP/mur" help > /dev/null
          echo '{}' | "$RUNNER_TEMP/mur" hook

  # gofmt runs on the other two: a Windows checkout turns line endings into CRLF, which gofmt reports.
  # `internal/daemon` alone ran past the 50-minute limit on 2026-11-12 (#496) while the other
  # packages together took about 8 minutes.
  test-windows:
    needs: changes
    if: needs.changes.outputs.level == 'go' || needs.changes.outputs.level == 'full'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go list ./... | grep -v '/internal/daemon$' | xargs bash scripts/go-test-retry.sh -race -count=1 -timeout 25m

  # The daemon package's tests, dealt out by position in their sorted list to one runner each: four
  # on Windows, where they are slowest, and two on macOS. A test added later lands in some shard on
  # its own, so none goes unrun. A pull request runs them only at `full` (#879).
  #
  # A test that hangs should end in Go's -timeout panic, which names it and prints every goroutine,
  # not in the job's cancellation, which keeps no log (#727). A hang is never retried, so what must
  # fit a job's limit is the longest run that doesn't hang, plus a retry of what failed, which may
  # hang, plus setup; -timeout counts the test binary alone, not the build. The retry runs a few
  # tests alone, so here it has its own 10 minutes (RETRY_TIMEOUT), and the first run 45: Windows
  # shard 1's binary takes 1,154 s (2026-11-16), 45 + 10 + setup is within 75, and in the jobs
  # above, whose tests take 3 to 8 minutes, 25 is.
  test-daemon:
    needs: changes
    if: needs.changes.outputs.level == 'full'
    name: test-${{ matrix.os }}-daemon (${{ matrix.shard }})
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, shard: 0, of: 4 }
          - { os: windows, shard: 1, of: 4 }
          - { os: windows, shard: 2, of: 4 }
          - { os: windows, shard: 3, of: 4 }
          - { os: macos, shard: 0, of: 2 }
          - { os: macos, shard: 1, of: 2 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test -race (shard ${{ matrix.shard }} of ${{ matrix.of }})
        env:
          MURMUR_GIT_STATS: ${{ runner.temp }}/git-stats.txt
          RETRY_TIMEOUT: 10m
          SHARD: ${{ matrix.shard }} # named with a test that was retried (go-test-retry.sh)
        run: |
          names=$(go test -list '^Test' ./internal/daemon | grep '^Test' | sort | awk -v k=${{ matrix.shard }} -v n=${{ matrix.of }} 'NR % n == k')
          test -n "$names"
          echo "$names" | wc -l
          # -v for each test's time (scripts/daemon-test-times.sh, #1008).
          bash scripts/go-test-retry.sh -v -race -count=1 -timeout 45m -run "^($(echo "$names" | paste -sd'|' -))\$" ./internal/daemon
      - name: How git did (#513)
        if: always()
        run: |
          f="$RUNNER_TEMP/git-stats.txt"
          if [ -f "$f" ]; then cat "$f"; { echo '```'; cat "$f"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"; fi
