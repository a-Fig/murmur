# Every pull request runs the checks each change must pass, so a change's verification doesn't wait
# on a laptop shared with other agents' test runs, or die when that laptop sleeps (#48).
#
# Three jobs run in parallel, on GitHub's own runners, which are free for a public repo and start
# fresh for every job. Until 2026-11-01 `test-linux` ran on a self-hosted VM; docs/testing.md says
# why it went.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    if: false # DEBUG217
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 50m ./...

  # gofmt runs on the other two: a Windows checkout turns line endings into CRLF, which gofmt reports.
  test-windows:
    if: false # DEBUG217
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 50m ./...

  test-linux:
    if: false # DEBUG217
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 50m ./...
